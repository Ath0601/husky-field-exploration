controller_manager:
  ros__parameters:
    update_rate: 100

    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    husky_velocity_controller:
      type: diff_drive_controller/DiffDriveController


husky_velocity_controller:
  ros__parameters:

    left_wheel_names:
      - front_left_wheel
      - rear_left_wheel

    right_wheel_names:
      - front_right_wheel
      - rear_right_wheel

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    wheel_separation: 0.5708
    wheel_radius: 0.1651
    wheels_per_side: 1

    publish_rate: 50.0

    base_frame_id: base_link
    odom_frame_id: odom
    tf_frame_prefix_enable: false
    enable_odom_tf: true

    use_stamped_vel: false

    cmd_vel_timeout: 0.5

    publish_limited_velocity: true

    velocity_rolling_window_size: 10

    position_feedback: true

    open_loop: false

    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01

    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01